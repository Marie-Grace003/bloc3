name: CI/CD Pipeline
on:
  push:
    branches: [ main, feature/docker-setup ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: pcov

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit tests with coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test --coverage --min=60

  deploy:
    needs: [build-test, backend-tests] 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/docker-setup' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # On compile le frontend sur GitHub
      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      # Déploiement FTP ultra-rapide (uniquement les fichiers mis à jour, SANS les dépendances lourdes)
      - name: Sync files to LWS FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 91.234.195.181
          username: ephraim-grace@ifran-b3dev.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          exclude: |
            **/node_modules/**
            **/vendor/**
            **/.git/**
            **/.github/**
            backend/storage/framework/cache/**
            backend/storage/framework/sessions/**
            backend/storage/framework/views/**
