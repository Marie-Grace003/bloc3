name: CI/CD Pipeline
on:
  push:
    branches: [ main, feature/docker-setup ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: pcov

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit tests with coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test --coverage --min=60

  deploy:
    needs: [build-test, backend-tests] 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/docker-setup' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Connexion SSH sécurisée pour commander à LWS de se mettre à jour via Git
      - name: Executing remote SSH commands using ssh-key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 91.234.195.181
          username: c2733348c
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 147
          script: |
            cd public_html/ephraim-grace
            git checkout feature/docker-setup
            git pull origin feature/docker-setup
            
            # Mettre à jour le backend Laravel directement sur le serveur LWS
            cd backend
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            php artisan migrate --force
            
            # Compiler le frontend React/Vue directement sur le serveur LWS
            cd ../frontend
            npm install
            npm run build
